name: Build

# Primary architectures: cross compiled on every push to master, on
# ubuntu-26.04, the first Ubuntu with a loongarch64 cross toolchain (and the
# image ubuntu-latest switches to in November 2026).  Dispatch with an "arches"
# list to build a subset, or run "CI build (one arch)" for a single
# architecture.
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      arches:
        description: 'Comma-separated subset (empty = all): x86_64 x86 aarch64 riscv64 loongarch64'
        required: false
        default: ''
  workflow_call:
    inputs:
      arches:
        description: 'Comma-separated subset (empty = all)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select arches
        id: select
        env:
          ALL_ARCHES: x86_64 x86 aarch64 riscv64 loongarch64
          REQUESTED: ${{ inputs.arches }}
        run: |
          set -eu
          if [ -z "$REQUESTED" ]; then
            selected=$ALL_ARCHES
          else
            selected=
            for arch in $(echo "$REQUESTED" | tr ',' ' '); do
              case " $ALL_ARCHES " in
                *" $arch "*) selected="$selected $arch" ;;
                *) echo "Unknown architecture '$arch'; valid: $ALL_ARCHES" >&2
                   exit 1 ;;
              esac
            done
          fi
          if [ -z "${selected// /}" ]; then
            echo "No architectures selected" >&2
            exit 1
          fi
          matrix=$(printf '%s\n' $selected | jq -R . | jq -s -c '{arch: .}')
          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/ci-arch-build.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ubuntu-26.04
